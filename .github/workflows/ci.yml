name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: sh -n install/install.sh
      # Smoke-test the standalone binary that the installer downloads.
      - run: node scripts/build-binaries.ts linux-x64
      - run: ./dist/bin/vibe-code-viewer-linux-x64 --version
