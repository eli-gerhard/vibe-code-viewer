# Publishes a release when a version tag is pushed: `npm version patch && git push --follow-tags`.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  binaries:
    # macOS, so the Mac binaries can be signed (ad-hoc, free). Bun cross-compiles the others.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Check the tag matches package.json
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run build:binaries
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/bin/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  npm:
    # Off until npm is set up: create the package on npmjs.com, add this repo as a trusted publisher
    # (workflow file release.yml), then set the repository variable NPM_PUBLISH to true.
    if: vars.NPM_PUBLISH == 'true'
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing (no stored npm token) needs a recent npm.
      - run: npm install -g npm@latest
      - run: npm publish --access public
